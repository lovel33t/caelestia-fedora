# Generated by setup.py - builds the image with BlueBuild.
name: Build

# NOTE: quoted deliberately. An unquoted bare `on:` is parsed by YAML 1.1 as
# the boolean True, which silently renames the trigger key and breaks the
# workflow on GitHub.
"on":
  push:
    branches: [main, live]
    tags: ['v*']
  # Weekly rebuild so the base image (wayblue publishes :daily updates) and
  # our pinned upstream sources are refreshed on a schedule, not only on push.
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch:

jobs:
  build:
    name: Build and push the Caelestia Atomic image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: caelestia-fedora

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image with BlueBuild
        # NOTE: the action is blue-build/github-action. The old
        # `bluebuild/bluebuild-action` does not exist (404), so the workflow
        # died at this step. IMAGE_NAME was also not an input of the action;
        # the target registry is derived from `registry_token`.
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          pr_event_number: ${{ github.event.number }}
          # REQUIRED input: the action aborts in seconds if it is absent.
          # Value is the cosign private key (repo secret SIGNING_SECRET);
          # cosign.pub is committed at the repo root for verification.
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          # These match the inputs wayblue uses to build its own base image.
          # squash is the important one: without it BlueBuild emits OCI
          # layers on top of the base without producing a new ostree commit,
          # so rpm-ostree resolves every image to the base's commit and
          # `rebase` reports "Old and new refs are equal".
          squash: true
          build_chunked_oci: true
          max_layers: 128
          maximize_build_space: true
          retry_push_count: 3
          use_cache: false
          cli_version: v0.9.37

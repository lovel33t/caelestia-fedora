# Generated by setup.py - builds the image with BlueBuild.
name: Build

# NOTE: quoted deliberately. An unquoted bare `on:` is parsed by YAML 1.1 as
# the boolean True, which silently renames the trigger key and breaks the
# workflow on GitHub.
"on":
  push:
    branches: [main, live]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build and push the Caelestia Atomic image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: caelestia-fedora

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image with BlueBuild
        uses: bluebuild/bluebuild-action@v1
        with:
          IMAGE_NAME: ghcr.io/lovel33t/caelestia-fedora/${{ IMAGE_NAME }}

# Generated by setup.py - builds the image with BlueBuild.
name: Build

# NOTE: quoted deliberately. An unquoted bare `on:` is parsed by YAML 1.1 as
# the boolean True, which silently renames the trigger key and breaks the
# workflow on GitHub.
"on":
  push:
    branches: [main, live]
    tags: ['v*']
  # Weekly rebuild so the base image (wayblue publishes :daily updates) and
  # our pinned upstream sources are refreshed on a schedule, not only on push.
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch:

jobs:
  build:
    name: Build and push the Caelestia Atomic image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # Without this, two runs can overlap and the slower one can overwrite
    # :latest last, leaving users upgrading to a stale image. Cancelling the
    # in-progress run guarantees the newest commit owns the tag.
    concurrency:
      group: caelestia-image-build
      cancel-in-progress: true
    env:
      IMAGE_NAME: caelestia-fedora

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Follow Fedora releases without a manual bump. wayblue publishes its own
      # image as <name>:<image-version>, so when Fedora 45 lands there will be
      # a :45 tag and this bumps packages.json to match.
      #
      # This probes for CURRENT+1 rather than listing tags: the registry
      # paginates at 1000 and wayblue has far more than that, so a tag listing
      # does not even contain :44 and would "bump" us backwards to :42.
      # Probing one version ahead can only ever move forward.
      - name: Follow the base image version
        run: |
          set -euo pipefail
          REPO=wayblueorg/hyprland-nvidia-open
          TOKEN=$(curl -sS "https://ghcr.io/token?scope=repository:$REPO:pull&service=ghcr.io" | jq -r .token)
          have_tag() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/$REPO/manifests/$1")
            [ "$code" = "200" ]
          }
          CUR=$(jq -r '.base_image_version' config/packages.json)
          V=$((CUR + 1)); BUMPED=""
          for _ in 1 2 3 4 5; do
            if have_tag "$V"; then BUMPED="$V"; V=$((V + 1)); else break; fi
          done
          if [ -n "$BUMPED" ]; then
            echo "::notice::Base image has Fedora $BUMPED (was $CUR); following it."
            jq --arg v "$BUMPED" '.base_image_version = $v' config/packages.json > p.tmp
            mv p.tmp config/packages.json
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/packages.json
            git commit -m "Follow base image to Fedora $BUMPED (automated)"
            git push
          else
            echo "Base image still on Fedora $CUR; nothing to follow."
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image with BlueBuild
        # NOTE: the action is blue-build/github-action. The old
        # `bluebuild/bluebuild-action` does not exist (404), so the workflow
        # died at this step. IMAGE_NAME was also not an input of the action;
        # the target registry is derived from `registry_token`.
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          pr_event_number: ${{ github.event.number }}
          # REQUIRED input: the action aborts in seconds if it is absent.
          # Value is the cosign private key (repo secret SIGNING_SECRET);
          # cosign.pub is committed at the repo root for verification.
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          # These match the inputs wayblue uses to build its own base image.
          # squash is the important one: without it BlueBuild emits OCI
          # layers on top of the base without producing a new ostree commit,
          # so rpm-ostree resolves every image to the base's commit and
          # `rebase` reports "Old and new refs are equal".
          squash: true
          build_chunked_oci: true
          max_layers: 128
          maximize_build_space: true
          retry_push_count: 3
          use_cache: false
          cli_version: v0.9.37

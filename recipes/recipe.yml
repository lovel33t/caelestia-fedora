---
# GENERATED BY build.py - do not edit by hand.
name: caelestia-fedora
description: Caelestia shell + CLI on wayblue hyprland-nvidia-open

base-image: ghcr.io/wayblueorg/hyprland-nvidia-open
image-version: latest

# The from-source components (quickshell, the caelestia shell + plugins, the
# CLI, libcava, m3shapes, lazygit, gpu-screen-recorder, dart-sass, rubik) are
# compiled in a separate stage and copied in, so the shipped image never
# carries the toolchain. Without this stage the image was built from wayblue
# alone and contained none of them.
stages:
  - name: caelestia-builder
    from: registry.fedoraproject.org/fedora:44
    modules:
      - type: script
        # BlueBuild 0.9.37 emits ARG CONFIG_DIRECTORY="/tmp/config" for the
        # builder stage but "/tmp/files" for the main image, and never mounts
        # /tmp/config in a stage. The script module therefore looks for
        # /tmp/config/scripts, finds nothing, and aborts with "Cannot declare
        # scripts to run if /tmp/config/scripts doesn't exist". The module
        # only raises that when `scripts` is non-empty, and /tmp/files *is*
        # mounted (it carries the repo's files/), so invoking the script from
        # there via a snippet works around it.
        snippets:
          - bash /tmp/files/scripts/build-from-source.sh

modules:
  # 1. Package set
  - type: dnf
    repos:
      copr:
          - atim/starship
          - craftidore/wayblueorg-hyprland
    install:
      install-weak-deps: false
      packages:
        - zsh
        - bash
        - Thunar
        - thunar-archive-plugin
        - thunar-volman
        - fastfetch
        - hyprpicker
        - wl-clipboard
        - cliphist
        - fuzzel
        - grim
        - slurp
        - swappy
        - dconf
        - libnotify
        - xdg-user-dirs
        - xdg-desktop-portal-gtk
        - ddcutil
        - brightnessctl
        - lm_sensors
        - trash-cli
        - ydotool
        - adw-gtk3-theme
        - papirus-icon-theme
        - gnome-keyring
        - btop
        - micro
        - foot
        - eza
        - zoxide
        - direnv
        - starship
        - curl
        - git
        - jq
        - bat
        - ripgrep
        - jetbrains-mono-fonts
        - cascadia-code-fonts
        - google-noto-emoji-fonts
        - google-noto-fonts-common
        - google-noto-sans-cjk-fonts
        - libqalculate
        - aubio
        - jemalloc
        - xfce-polkit
        - polkit
        - ffmpeg-free
        - fish
        - pwvucontrol
        - bluez-utils
        - papirus-folders
        - hyprpolkitagent
        - geoclue2

  # 2. Strip wayblue's waybar config + Hyprland lua: caelestia provides its own
  - type: script
    scripts:
      - apply-wayblue-overrides.sh

  # 3. Runtime artefacts from the builder stage. /out mirrors the final
  #    filesystem, so these four recursive copies replace the ~20 individual
  #    COPY --from=builder lines the generated Containerfile used.
  - type: copy
    from: caelestia-builder
    src: /out/usr
    dest: /usr
  - type: copy
    from: caelestia-builder
    src: /out/opt
    dest: /opt
  - type: copy
    from: caelestia-builder
    src: /out/etc
    dest: /etc
  - type: copy
    from: caelestia-builder
    src: /out/wheel
    dest: /tmp/caelestia-wheel

  # 4. Fixups that cannot be expressed as a copy: the `qs` alias, the sass
  #    launcher on PATH, and installing the CLI wheel with its dependencies.
  - type: script
    snippets:
      - ln -sf quickshell /usr/bin/qs
      - ln -sf /opt/dart-sass/sass /usr/bin/sass
      # --prefix=/usr because /usr/local -> /var/usrlocal and bootc does not
      # commit /var: a default pip install lands there and vanishes on commit.
      - >-
        dnf install -y python3-pip >/dev/null 2>&1 &&
        pip3 install --no-cache-dir --prefix=/usr /tmp/caelestia-wheel/*.whl >/dev/null 2>&1 &&
        rm -rf /tmp/caelestia-wheel &&
        python3 -c "import caelestia" &&
        fc-cache -f

  # 5. caelestia wrapper, udev rules, zsh defaults, skel seeding
  # `source` is relative to the repo's files/ directory (BlueBuild docs), so
  # `usr` means files/usr. The old `system/usr` pointed at a path that does
  # not exist and silently copied nothing.
  - type: files
    files:
      - source: usr
        destination: /usr
      - source: etc
        destination: /etc

  # 6. Keep caelestia shell + CLI on PATH after deploy
  - type: systemd
    system:
      enabled:
        # Without this the unit ships but never runs, so the dots are never
        # deployed and SDDM locks the user out: starthyprland falls back to
        # /usr/share/hyprland/hyprland.lua, which does not exist.
        - caelestia-firstboot.service
    user:
      enabled:
        - caelestia-shell.service

  - type: signing

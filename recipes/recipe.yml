---
# GENERATED BY build.py - do not edit by hand.
name: caelestia-fedora
description: Caelestia shell + CLI on wayblue hyprland-nvidia-open

base-image: ghcr.io/wayblueorg/hyprland-nvidia-open:latest
image-version: 44

modules:
  # 1. Package set (from-source components come from the builder stage)
  - type: dnf
    repos:
      copr:
          - atim/starship
          - craftidore/wayblueorg-hyprland
    install:
      install-weak-deps: false
      packages:
        - zsh
        - bash
        - Thunar
        - thunar-archive-plugin
        - thunar-volman
        - fastfetch
        - hyprpicker
        - wl-clipboard
        - cliphist
        - fuzzel
        - grim
        - slurp
        - swappy
        - dconf
        - libnotify
        - xdg-user-dirs
        - xdg-desktop-portal-gtk
        - ddcutil
        - brightnessctl
        - lm_sensors
        - trash-cli
        - ydotool
        - adw-gtk3-theme
        - papirus-icon-theme
        - gnome-keyring
        - btop
        - micro
        - foot
        - eza
        - zoxide
        - direnv
        - starship
        - curl
        - git
        - jq
        - bat
        - ripgrep
        - jetbrains-mono-fonts
        - cascadia-code-fonts
        - google-noto-emoji-fonts
        - google-noto-fonts-common
        - google-noto-sans-cjk-fonts
        - libqalculate
        - aubio
        - jemalloc
        - xfce-polkit
        - polkit
        - ffmpeg-free

  # 2. Strip wayblue's waybar config + Hyprland lua: caelestia provides its own
  - type: script
    scripts:
      - apply-wayblue-overrides.sh

  # 3. caelestia wrapper, udev rules, zsh defaults, skel seeding
  # `source` is relative to the repo's files/ directory (BlueBuild docs), so
  # `usr` means files/usr. The old `system/usr` pointed at a path that does
  # not exist and silently copied nothing.
  - type: files
    files:
      - source: usr
        destination: /usr
      - source: etc
        destination: /etc

  # 4. Keep caelestia shell + CLI on PATH after deploy
  - type: systemd
    user:
      enabled:
        - caelestia-shell.service

  - type: signing
